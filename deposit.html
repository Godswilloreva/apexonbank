    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --header-bg: rgba(255, 255, 255, 0.85);
            --input-border: #cbd5e1;
            --input-bg: #f8fafc;
            --tab-bg: #f1f5f9;
            --hero-bg: linear-gradient(135deg, #0b1329 0%, #1a233a 100%);
            --accent-gold: #b38728;
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        body.dark-theme-active {
            --bg-primary: #070a12;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
            --header-bg: rgba(15, 23, 42, 0.85);
            --input-border: #334155;
            --input-bg: #070a12;
            --tab-bg: #1e293b;
            --hero-bg: linear-gradient(135deg, #030712 0%, #0f172a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 90px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--tab-bg);
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-hero {
            background: var(--hero-bg);
            color: #ffffff;
            padding: 24px 20px;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hero-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hero-val {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
            color: #ffffff;
        }

        .channel-tag {
            background: rgba(179, 135, 40, 0.15);
            color: #FCF6BA;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(179, 135, 40, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .channel-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
        }

        .page-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--accent-gold);
        }

        .error-msg {
            font-size: 12px;
            color: var(--error-red);
            margin-top: 10px;
            display: none;
            font-weight: 600;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--error-red);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--hero-bg);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* 10-Second Processing Overlay */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(179, 135, 40, 0.15);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            margin-top: 24px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 80%;
            line-height: 1.4;
        }

        .countdown-timer {
            margin-top: 12px;
            color: var(--accent-gold);
            font-size: 14px;
            font-weight: 700;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>

    </header>

    <div class="balance-hero">
        <div class="hero-meta">
            <div>
                <p class="hero-label">Available Balance</p>
                <h2 class="hero-val" id="liveBalanceDisplay">Syncing...</h2>
            </div>
            <div style="text-align: right;">
                <p class="hero-label">Deposit Gateway</p>
                <span class="channel-tag" id="channelIndicator">
                    <span class="channel-dot"></span> Active
                </span>
            </div>
        </div>
    </div>

    <div class="page-container">
        <form id="depositForm" class="form-card">
            
            <!-- SECTION 1: COUNTRY SELECTOR -->
            <div class="form-section-title">1. Select Destination Country</div>

            <div class="input-group">
                <label>🏳️ Deposit Country</label>
                <select id="senderCountry" required>
                    <option value="" disabled selected>Select your country...</option>
                    <option value="United States">United States 🇺🇸</option>
                    <option value="United Kingdom">United Kingdom 🇬🇧</option>
                    <option value="Mexico">Mexico 🇲🇽</option>
                    <option value="Colombia">Colombia 🇨🇴</option>
                    <option value="Ecuador">Ecuador 🇪🇨</option>
                    <option value="Germany">Germany 🇩🇪</option>
                    <option value="Venezuela">Venezuela 🇻🇪</option>
                    <option value="Nigeria">Nigeria 🇳🇬</option>
                </select>
            </div>

            <!-- SECTION 2: DEPOSIT METHOD & AMOUNT -->
            <div class="form-section-title">2. Deposit Details</div>

            <div class="input-group">
                <label>💳 Deposit Gateway / Channel</label>
                <select id="depositMethod" required>
                    <option value="" disabled selected>Select transfer channel...</option>
                    <option value="Wire Transfer (SWIFT / SEPA / ACH)">Wire Transfer / Direct Bank Transfer</option>
                    <option value="Cryptocurrency (BTC / USDT / ETH)">Cryptocurrency Deposit</option>
                    <option value="Mobile Check Deposit">Mobile Check Deposit</option>
                    <option value="Credit / Debit Card Direct">Credit / Debit Card Direct</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>🔤 Currency</label>
                    <select id="depositCurrency" required>
                        <option value="USD">USD ($)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="MXN">MXN ($)</option>
                        <option value="COP">COP ($)</option>
                        <option value="VES">VES (Bs.)</option>
                        <option value="NGN">NGN (₦)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>💰 Amount</label>
                    <input type="number" step="0.01" id="depositAmount" placeholder="0.00" required>
                </div>
            </div>

            <!-- SECTION 3: SENDER & BANK DETAILS (DYNAMIC) -->
            <div class="form-section-title">3. Country Bank Identification</div>

            <div class="input-group">
                <label>👤 Sender Full Name</label>
                <input type="text" id="senderName" placeholder="Full name on account" required>
            </div>

            <div class="input-group">
                <label>🏛️ Source Bank Name</label>
                <input type="text" id="bankName" placeholder="e.g. Chase, Barclays, BBVA, Access Bank" required>
            </div>

            <!-- Dynamic Fields Container -->
            <div id="countryFieldsContainer">
                <div class="grid-2">
                    <div class="input-group">
                        <label id="accountNoLabel">🏦 Account Number / IBAN</label>
                        <input type="text" id="accountNo" placeholder="Account Number" required>
                    </div>
                    <div class="input-group" id="fieldBox1">
                        <label id="fieldLabel1">🔢 Routing / Sort Code / SWIFT</label>
                        <input type="text" id="fieldInput1" placeholder="Code">
                    </div>
                </div>

                <div class="grid-2" id="rowTwoContainer">
                    <div class="input-group" id="fieldBox2">
                        <label id="fieldLabel2">📍 Additional Field 1</label>
                        <input type="text" id="fieldInput2" placeholder="Identifier">
                    </div>
                    <div class="input-group" id="fieldBox3">
                        <label id="fieldLabel3">🆔 ID / RIF / SSN</label>
                        <input type="text" id="fieldInput3" placeholder="Tax / Identification ID">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>📝 Reference / Deposit Note</label>
                <textarea id="depositMemo" rows="2" placeholder="Optional transaction memo or reference number"></textarea>
            </div>

            <div class="error-msg" id="statusError"></div>

            <button type="submit" id="submitBtn" class="action-btn">
                <span>Transfer</span>
            </button>
        </form>
    </div>

    <!-- 10-Second Processing Spinner Overlay -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <div class="spinner-text">Connecting to the security team for deposit confirmation, thank you...</div>
        <div class="countdown-timer" id="countdownTimer">10s remaining</div>
    </div>

        <a href="user-dashboard.html" class="nav-item"><div style="font-size: 20px;">🏛️</div><div>Home</div></a>
        <a href="loans.html" class="nav-item"><div style="font-size: 20px;">💰</div><div>Loans</div></a>
        <a href="card.html" class="nav-item"><div style="font-size: 20px;">💳</div><div>Cards</div></a>
        <a href="profile.html" class="nav-item"><div style="font-size: 20px;">👤</div><div>Profile</div></a>
        <a href="settings.html" class="nav-item"><div style="font-size: 20px;">⚙️</div><div>Settings</div></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjHf4jXF-12q0Ux9FXuC9qvPbtSybiGg",
            authDomain: "apexon-18436.firebaseapp.com",
            projectId: "apexon-18436",
            storageBucket: "apexon-18436.firebasestorage.app",
            messagingSenderId: "860159843934",
            appId: "1:860159843934:web:d149cd4766935be2525ecf",
            measurementId: "G-TZ7QJMGJK0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.activeUserDocRef = null;
        window.currentUserData = null;

        // Dynamic Country Configuration Mapping
        const countrySpecs = {
            "United States": {
                currency: "USD",
                accountLabel: "🏦 Account Number",
                label1: "🔢 ABA / Routing Number (9-digits)",
                holder1: "e.g. 122400724",
                label2: "🏛️ Account Type",
                holder2: "Checking or Savings",
                label3: "🆔 SSN / Tax ID (Last 4 digits)",
                holder3: "e.g. 1234",
                showRowTwo: true
            },
            "United Kingdom": {
                currency: "GBP",
                accountLabel: "🏦 Account Number (8 digits)",
                label1: "🔢 Sort Code (6 digits)",
                holder1: "e.g. 20-40-60",
                label2: "🌐 IBAN (Optional)",
                holder2: "GB...",
                showRowTwo: false
            },
            "Mexico": {
                currency: "MXN",
                accountLabel: "🏦 CLABE Interbancaria (18 digits)",
                label1: "🔢 RFC (Tax Identifier)",
                holder1: "e.g. ABCD123456XYZ",
                showRowTwo: false
            },
            "Colombia": {
                currency: "COP",
                accountLabel: "🏦 Account Number",
                label1: "🔢 Document Type & Number (CC / NIT)",
                holder1: "e.g. CC 10293847",
                label2: "🏛️ Account Type",
                holder2: "Ahorros or Corriente",
                showRowTwo: false
            },
            "Ecuador": {
                currency: "USD",
                accountLabel: "🏦 Account Number",
                label1: "🔢 Cédula / RUC ID",
                holder1: "e.g. 1712345678",
                label2: "🏛️ Account Type",
                holder2: "Ahorros or Corriente",
                showRowTwo: false
            },
            "Germany": {
                currency: "EUR",
                accountLabel: "🏦 IBAN (Deutsches Format)",
                label1: "🌐 BIC / SWIFT Code",
                holder1: "e.g. DBKDEFDFXXX",
                showRowTwo: false
            },
            "Venezuela": {
                currency: "VES",
                accountLabel: "🏦 Account Number (20 digits)",
                label1: "🆔 RIF / Cédula (V/E/J)",
                holder1: "e.g. V-12345678",
                label2: "📱 Pago Móvil Phone (if applicable)",
                holder2: "e.g. 04141234567",
                showRowTwo: false
            },
            "Nigeria": {
                currency: "NGN",
                accountLabel: "🏦 NUBAN Account Number (10 digits)",
                label1: "🔢 Bank Routing / Sort Code",
                holder1: "e.g. 057150013",
                label2: "🆔 BVN / NIN (Verification)",
                holder2: "11-digit verification number",
                showRowTwo: false
            }
        };

        const countrySelect = document.getElementById('senderCountry');
        const depositCurrency = document.getElementById('depositCurrency');
        const accountNoLabel = document.getElementById('accountNoLabel');
        const fieldLabel1 = document.getElementById('fieldLabel1');
        const fieldInput1 = document.getElementById('fieldInput1');
        const fieldBox2 = document.getElementById('fieldBox2');
        const fieldLabel2 = document.getElementById('fieldLabel2');
        const fieldInput2 = document.getElementById('fieldInput2');
        const fieldBox3 = document.getElementById('fieldBox3');
        const fieldLabel3 = document.getElementById('fieldLabel3');
        const fieldInput3 = document.getElementById('fieldInput3');
        const rowTwoContainer = document.getElementById('rowTwoContainer');

        countrySelect.addEventListener('change', function() {
            const country = this.value;
            const config = countrySpecs[country];

            if (config) {
                depositCurrency.value = config.currency;
                accountNoLabel.innerText = config.accountLabel;
                
                fieldLabel1.innerText = config.label1;
                fieldInput1.placeholder = config.holder1 || "";

                if (config.label2) {
                    fieldBox2.style.display = 'flex';
                    fieldLabel2.innerText = config.label2;
                    fieldInput2.placeholder = config.holder2 || "";
                } else {
                    fieldBox2.style.display = 'none';
                }

                if (config.label3) {
                    fieldBox3.style.display = 'flex';
                    fieldLabel3.innerText = config.label3;
                    fieldInput3.placeholder = config.holder3 || "";
                } else {
                    fieldBox3.style.display = 'none';
                }

                if (config.showRowTwo || config.label3) {
                    rowTwoContainer.style.display = 'grid';
                } else if (!config.label2 && !config.label3) {
                    rowTwoContainer.style.display = 'none';
                } else {
                    rowTwoContainer.style.display = 'grid';
                }
            }
        });

        function parseNumericValue(val) {
            if (val === undefined || val === null) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            
            let str = String(val).replace(/[^0-9.-]/g, '');
            let parts = str.split('.');
            if (parts.length > 2) {
                str = parts[0] + '.' + parts.slice(1).join('');
            }

            let parsed = parseFloat(str);
            return isNaN(parsed) ? 0 : parsed;
        }

        function syncDashboardUI(data) {
            if (!data) return;
            const currency = data.currency || "$";
            
            let rawVal = data.balance ?? data.amount ?? data.availableBalance ?? data.accountBalance ?? 0;
            const parsedVal = parseNumericValue(rawVal);

            const formatted = parsedVal.toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });

            document.getElementById('liveBalanceDisplay').innerText = `${currency}${formatted}`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.activeUserDocRef = doc(db, "users", user.uid);
                onSnapshot(window.activeUserDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.currentUserData = docSnap.data();
                        syncDashboardUI(window.currentUserData);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('depositForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusError = document.getElementById('statusError');
            const submitBtn = document.getElementById('submitBtn');
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const countdownTimer = document.getElementById('countdownTimer');

            statusError.style.display = 'none';

            const countryInp = document.getElementById('senderCountry').value;
            const methodInp = document.getElementById('depositMethod').value;
            const currencyInp = document.getElementById('depositCurrency').value;
            const amountInp = parseFloat(document.getElementById('depositAmount').value);

            if (!countryInp || !methodInp || isNaN(amountInp) || amountInp <= 0) {
                statusError.innerText = "Please select a country, valid deposit channel, and amount.";
                statusError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;

            const userName = window.currentUserData?.fullName || window.currentUserData?.name || "Apexon User";
            const userAccount = window.currentUserData?.accountNo || "N/A";
            const formattedDepositAmount = `${currencyInp} ${amountInp.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            const alertDetails = {
                user_name: userName,
                user_account: userAccount,
                country: countryInp,
                deposit_method: methodInp,
                amount: formattedDepositAmount,
                sender_name: document.getElementById('senderName').value.trim(),
                bank_name: document.getElementById('bankName').value.trim(),
                account_no_iban: document.getElementById('accountNo').value.trim(),
                custom_field_1: document.getElementById('fieldInput1').value.trim() || "N/A",
                custom_field_2: document.getElementById('fieldInput2').value.trim() || "N/A",
                custom_field_3: document.getElementById('fieldInput3').value.trim() || "N/A",
                memo: document.getElementById('depositMemo').value.trim() || "None",
                security_email: "swiftoraxpress@gmail.com"
            };

            const alertMessage = `📥 GLOBAL DEPOSIT REQUEST 📥\n\n` +
                `User: ${userName} (${userAccount})\n` +
                `Country: ${countryInp}\n` +
                `Method: ${methodInp}\n` +
                `Amount: ${formattedDepositAmount}\n` +
                `Bank: ${alertDetails.bank_name}\n` +
                `Account/IBAN/CLABE: ${alertDetails.account_no_iban}\n` +
                `Field 1: ${alertDetails.custom_field_1}\n` +
                `Field 2: ${alertDetails.custom_field_2}\n` +
                `Memo: ${alertDetails.memo}`;

            // Silent Tawk.to Notification
            try {
                if (window.Tawk_API) {
                    if (typeof window.Tawk_API.sendMessage === 'function') {
                        window.Tawk_API.sendMessage(alertMessage);
                    }
                    if (typeof window.Tawk_API.addEvent === 'function') {
                        window.Tawk_API.addEvent('DepositRequest', alertDetails);
                    }
                }
            } catch (err) {
                console.warn("Tawk.to alert warning:", err);
            }

            // EmailJS Dispatch
            try {
                if (window.emailjs) {
                    emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', alertDetails);
                }
            } catch (err) {
                console.warn("EmailJS alert warning:", err);
            }

            // Save to Firestore
            try {
                const now = new Date();
                const pendingTx = {
                    title: `Deposit (${methodInp}) - ${countryInp}`,
                    description: `Pending deposit request from ${alertDetails.bank_name}`,
                    amount: amountInp,
                    currency: currencyInp,
                    type: "credit",
                    status: "Pending Verification",
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                updateDoc(window.activeUserDocRef, {
                    transactions: arrayUnion(pendingTx)
                });
            } catch (err) {
                console.error("Firestore logging error:", err);
            }

            // Show 10-second processing animation with custom security message
            spinnerOverlay.style.display = 'flex';
            let secondsLeft = 10;
            countdownTimer.innerText = `${secondsLeft}s remaining`;

            const interval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    countdownTimer.innerText = `${secondsLeft}s remaining`;
                } else {
                    clearInterval(interval);
                    spinnerOverlay.style.display = 'none';
                    submitBtn.disabled = false;
                    
                    // Directly open Tawk.to Live Chat widget for security team message
                    if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
                        window.Tawk_API.maximize();
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
