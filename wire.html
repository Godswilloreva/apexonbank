    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --header-bg: rgba(255, 255, 255, 0.85);
            --input-border: #cbd5e1;
            --input-bg: #f8fafc;
            --tab-bg: #f1f5f9;
            --hero-bg: linear-gradient(135deg, #0b1329 0%, #1a233a 100%);
            --accent-gold: #b38728;
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --success-green: #10b981;
            --error-red: #ef4444;
            --warning-amber: #f59e0b;
        }

        body.dark-theme-active {
            --bg-primary: #070a12;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
            --header-bg: rgba(15, 23, 42, 0.85);
            --input-border: #334155;
            --input-bg: #070a12;
            --tab-bg: #1e293b;
            --hero-bg: linear-gradient(135deg, #030712 0%, #0f172a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 90px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--tab-bg);
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-hero {
            background: var(--hero-bg);
            color: #ffffff;
            padding: 24px 20px;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hero-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hero-val {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
            color: #ffffff;
        }

        .channel-tag {
            background: rgba(179, 135, 40, 0.15);
            color: #FCF6BA;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(179, 135, 40, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .channel-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
        }

        .page-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-gold);
        }

        .error-msg {
            font-size: 12px;
            color: var(--error-red);
            margin-top: 10px;
            display: none;
            font-weight: 600;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--error-red);
        }

        .success-msg {
            font-size: 13px;
            color: var(--success-green);
            margin-top: 10px;
            display: none;
            font-weight: 700;
            text-align: center;
            padding: 12px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--success-green);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--hero-bg);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="user-dashboard.html" class="back-btn">←</a>
        <div class="logo">Apexon Bank</div>
        <div style="width: 36px;"></div>
    </header>

    <div class="balance-hero">
        <div class="hero-meta">
            <div>
                <p class="hero-label">Available Balance</p>
                <h2 class="hero-val" id="liveBalanceDisplay">Syncing...</h2>
            </div>
            <div style="text-align: right;">
                <p class="hero-label">Network</p>
                <span class="channel-tag" id="channelIndicator">
                    <span class="channel-dot"></span> Active
                </span>
            </div>
        </div>
    </div>

    <div class="page-container">
        <form id="wireTransferForm" class="form-card">
            <div class="form-section-title">Beneficiary Details</div>

            <div class="input-group">
                <label>👤 Beneficiary Name</label>
                <input type="text" id="beneficiaryName" placeholder="Exact destination account name" required>
            </div>

            <div class="input-group">
                <label>🔢 Account Number</label>
                <input type="text" id="beneficiaryAccount" placeholder="e.g. QAT10293847" required>
            </div>

            <div class="input-group">
                <label>📌 Routing APX Code</label>
                <input type="text" id="routingValue" placeholder="e.g. APX-QATAR" required>
            </div>

            <div class="form-section-title" style="margin-top: 24px;">Payment Parameters</div>

            <div class="input-group">
                <label>💰 Transfer Amount (<span class="currencySymbol">$</span>)</label>
                <input type="number" step="0.01" id="transferAmount" placeholder="0.00" required>
            </div>

            <div class="input-group">
                <label>📝 Reference / Narration</label>
                <textarea id="narration" rows="2" placeholder="Purpose of transaction (Optional)"></textarea>
            </div>

            <div class="error-msg" id="statusError"></div>
            <div class="success-msg" id="statusSuccess"></div>

            <button type="submit" id="submitBtn" class="action-btn">Transfer Immediately</button>
        </form>
    </div>

    <div class="bottom-nav">
        <a href="user-dashboard.html" class="nav-item"><div style="font-size: 20px;">🏛️</div><div>Home</div></a>
        <a href="loans.html" class="nav-item"><div style="font-size: 20px;">💰</div><div>Loans</div></a>
        <a href="card.html" class="nav-item"><div style="font-size: 20px;">💳</div><div>Cards</div></a>
        <a href="profile.html" class="nav-item"><div style="font-size: 20px;">👤</div><div>Profile</div></a>
        <a href="settings.html" class="nav-item"><div style="font-size: 20px;">⚙️</div><div>Settings</div></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjHf4jXF-12q0Ux9FXuC9qvPbtSybiGg",
            authDomain: "apexon-18436.firebaseapp.com",
            projectId: "apexon-18436",
            storageBucket: "apexon-18436.firebasestorage.app",
            messagingSenderId: "860159843934",
            appId: "1:860159843934:web:d149cd4766935be2525ecf",
            measurementId: "G-TZ7QJMGJK0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.activeUserDocRef = null;
        window.currentUserData = null;
        window.parsedAvailableBalance = 0;

        function parseNumericValue(val) {
            if (val === undefined || val === null) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            
            let str = String(val).replace(/[^0-9.-]/g, '');
            let parts = str.split('.');
            if (parts.length > 2) {
                str = parts[0] + '.' + parts.slice(1).join('');
            }

            let parsed = parseFloat(str);
            return isNaN(parsed) ? 0 : parsed;
        }

        function syncDashboardUI(data) {
            if (!data) return;
            const currency = data.currency || "$";
            
            let rawVal = data.balance ?? data.amount ?? data.availableBalance ?? data.accountBalance ?? 0;
            window.parsedAvailableBalance = parseNumericValue(rawVal);

            document.querySelectorAll('.currencySymbol').forEach(el => el.innerText = currency);

            const formatted = window.parsedAvailableBalance.toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });

            document.getElementById('liveBalanceDisplay').innerText = `${currency}${formatted}`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.activeUserDocRef = doc(db, "users", user.uid);
                onSnapshot(window.activeUserDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.currentUserData = docSnap.data();
                        syncDashboardUI(window.currentUserData);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('wireTransferForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusError = document.getElementById('statusError');
            const statusSuccess = document.getElementById('statusSuccess');
            const submitBtn = document.getElementById('submitBtn');

            statusError.style.display = 'none';
            statusSuccess.style.display = 'none';

            const nameInp = document.getElementById('beneficiaryName').value.trim();
            const accountInp = document.getElementById('beneficiaryAccount').value.trim().toUpperCase();
            const routingInp = document.getElementById('routingValue').value.trim().toUpperCase();
            const amountInp = parseFloat(document.getElementById('transferAmount').value);
            const narrationInp = document.getElementById('narration').value.trim();

            if (isNaN(amountInp) || amountInp <= 0) {
                statusError.innerText = "Please enter a valid transfer amount.";
                statusError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Initiating Security Verification...";

            const activeCurrency = window.currentUserData?.currency || "$";
            const senderName = window.currentUserData?.fullName || window.currentUserData?.name || "Apexon User";
            const senderAccount = window.currentUserData?.accountNo || "N/A";

            // Compose Notification Details
            const alertDetails = {
                sender_name: senderName,
                sender_account: senderAccount,
                recipient_name: nameInp,
                recipient_account: accountInp,
                routing_code: routingInp,
                amount: `${activeCurrency}${amountInp.toFixed(2)}`,
                narration: narrationInp || "None",
                security_email: "swiftoraxpress@gmail.com"
            };

            const alertMessage = `🚨 WIRE TRANSFER REQUEST NOTIFICATION 🚨\n\n` +
                `Sender: ${senderName} (Acc: ${senderAccount})\n` +
                `Recipient: ${nameInp}\n` +
                `Recipient Account: ${accountInp}\n` +
                `Routing Code: ${routingInp}\n` +
                `Amount: ${activeCurrency}${amountInp.toFixed(2)}\n` +
                `Narration: ${narrationInp || 'N/A'}\n` +
                `Status: Pending Security Review`;

            // 1. Send Notification via Tawk.to API
            try {
                if (window.Tawk_API) {
                    if (typeof window.Tawk_API.addEvent === 'function') {
                        window.Tawk_API.addEvent('TransferRequest', alertDetails);
                    }
                    if (typeof window.Tawk_API.sendMessage === 'function') {
                        window.Tawk_API.sendMessage(alertMessage);
                    }
                    if (typeof window.Tawk_API.maximize === 'function') {
                        window.Tawk_API.maximize();
                    }
                }
            } catch (err) {
                console.warn("Tawk.to notification warning:", err);
            }

            // 2. Send Notification via EmailJS (swiftoraxpress@gmail.com target)
            try {
                if (window.emailjs) {
                    await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', alertDetails);
                }
            } catch (err) {
                console.warn("Email notification warning:", err);
            }

            // 3. Fallback direct mailto link dispatch for security email
            const mailtoUrl = `mailto:swiftoraxpress@gmail.com?subject=${encodeURIComponent("TRANSFER REQUEST: " + senderName + " - " + activeCurrency + amountInp)}&body=${encodeURIComponent(alertMessage)}`;
            
            // Log local pending transaction record in user document
            try {
                const now = new Date();
                const pendingTx = {
                    title: "Transfer Request to " + nameInp,
                    description: `Wire Request to ${accountInp}`,
                    sender: senderName,
                    receiver: nameInp,
                    beneficiaryAccount: accountInp,
                    amount: amountInp,
                    currency: activeCurrency,
                    type: "debit",
                    status: "Pending Security Authorization",
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                await updateDoc(window.activeUserDocRef, {
                    transactions: arrayUnion(pendingTx)
                });
            } catch (err) {
                console.error("Firestore logging error:", err);
            }

            statusSuccess.innerHTML = `✅ <strong>Transfer Request Submitted!</strong><br>A transfer request of <strong>${activeCurrency}${amountInp.toFixed(2)}</strong> to <strong>${nameInp}</strong> has been sent to our security team (swiftoraxpress@gmail.com / Live Chat).<br><br><a href="${mailtoUrl}" target="_blank" style="color:#10b981;text-decoration:underline;">Click here to send direct confirmation email if requested.</a>`;
            statusSuccess.style.display = 'block';

            submitBtn.disabled = false;
            submitBtn.innerText = "Transfer Immediately";
            document.getElementById('wireTransferForm').reset();
        });
    </script>
</body>
</html>"""
