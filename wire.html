<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apexon Bank | Fund Transfer</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=700&family=Space+Grotesk:wght=400;500;600;700&display=swap" rel="stylesheet">

    <!-- Start of Tawk.to Script -->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6aba88484f795a343b370ead/default';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();

    <!-- End of Tawk.to Script -->

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init("YOUR_PUBLIC_KEY");
       })();
    </script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --header-bg: rgba(255, 255, 255, 0.85);
            --input-border: #cbd5e1;
            --input-bg: #f8fafc;
            --tab-bg: #f1f5f9;
            --hero-bg: linear-gradient(135deg, #0b1329 0%, #1a233a 100%);
            --accent-gold: #b38728;
            --gold-gradient: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            --success-green: #10b981;
            --error-red: #ef4444;
        }

        body.dark-theme-active {
            --bg-primary: #070a12;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
            --header-bg: rgba(15, 23, 42, 0.85);
            --input-border: #334155;
            --input-bg: #070a12;
            --tab-bg: #1e293b;
            --hero-bg: linear-gradient(135deg, #030712 0%, #0f172a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            padding-bottom: 90px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--tab-bg);
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .balance-hero {
            background: var(--hero-bg);
            color: #ffffff;
            padding: 24px 20px;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hero-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .hero-val {
            font-size: 26px;
            font-weight: 700;
            margin-top: 4px;
            color: #ffffff;
        }

        .channel-tag {
            background: rgba(179, 135, 40, 0.15);
            color: #FCF6BA;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(179, 135, 40, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .channel-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success-green);
            border-radius: 50%;
            display: inline-block;
        }

        .page-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .form-section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--accent-gold);
        }

        .error-msg {
            font-size: 12px;
            color: var(--error-red);
            margin-top: 10px;
            display: none;
            font-weight: 600;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--error-red);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            background: var(--hero-bg);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* 10-Second Processing Overlay */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(179, 135, 40, 0.15);
            border-top: 4px solid var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner-text {
            margin-top: 24px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 85%;
            line-height: 1.5;
        }

        .countdown-timer {
            margin-top: 12px;
            color: var(--accent-gold);
            font-size: 14px;
            font-weight: 700;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 68px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <a href="user-dashboard.html" class="back-btn">←</a>
        <div class="logo">Apexon Bank</div>
        <div style="width: 36px;"></div>
    </header>

    <div class="balance-hero">
        <div class="hero-meta">
            <div>
                <p class="hero-label">Available Balance</p>
                <h2 class="hero-val" id="liveBalanceDisplay">Syncing...</h2>
            </div>
            <div style="text-align: right;">
                <p class="hero-label">Transfer Gateway</p>
                <span class="channel-tag">
                    <span class="channel-dot"></span> Active
                </span>
            </div>
        </div>
    </div>

    <div class="page-container">
        <form id="transferForm" class="form-card">
            
            <!-- SECTION 1: TRANSFER TYPE -->
            <div class="form-section-title">1. Select Transfer Type</div>

            <div class="input-group">
                <label>🚀 Transfer Method</label>
                <select id="transferType" required>
                    <option value="" disabled selected>Select transfer type...</option>
                    <option value="Apexon Internal Transfer">Apexon Internal Transfer</option>
                    <option value="Domestic Bank Transfer">Domestic Wire Transfer</option>
                    <option value="International Wire (SWIFT / SEPA)">International Wire (SWIFT / SEPA)</option>
                </select>
            </div>

            <!-- SECTION 2: AMOUNT & CURRENCY -->
            <div class="form-section-title">2. Transfer Amount</div>

            <div class="grid-2">
                <div class="input-group">
                    <label>🔤 Currency</label>
                    <select id="transferCurrency" required>
                        <option value="USD">USD ($)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="MXN">MXN ($)</option>
                        <option value="COP">COP ($)</option>
                        <option value="VES">VES (Bs.)</option>
                        <option value="NGN">NGN (₦)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>💰 Amount</label>
                    <input type="number" step="0.01" id="transferAmount" placeholder="0.00" required>
                </div>
            </div>

            <!-- SECTION 3: RECIPIENT DETAILS -->
            <div class="form-section-title">3. Recipient Information</div>

            <div class="input-group">
                <label>👤 Recipient Full Name</label>
                <input type="text" id="recipientName" placeholder="Full legal name of recipient" required>
            </div>

            <div class="input-group">
                <label>🏛️ Recipient Bank Name</label>
                <input type="text" id="recipientBank" placeholder="e.g. Chase, Barclays, BBVA, Apexon Bank" required>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label id="accountNoLabel">🏦 Account Number / IBAN</label>
                    <input type="text" id="recipientAccount" placeholder="Account Number or IBAN" required>
                </div>
                <div class="input-group" id="routingBox">
                    <label id="routingLabel">🔢 Routing / SWIFT / Sort Code</label>
                    <input type="text" id="routingCode" placeholder="Code">
                </div>
            </div>

            <div class="input-group">
                <label>📝 Purpose / Remarks</label>
                <textarea id="transferMemo" rows="2" placeholder="Optional payment description or reference"></textarea>
            </div>

            <div class="error-msg" id="statusError"></div>

            <button type="submit" id="submitBtn" class="action-btn">
                <span>Transfer Funds</span>
            </button>
        </form>
    </div>

    <!-- 10-Second Processing Spinner Overlay -->
    <div class="spinner-overlay" id="spinnerOverlay">
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>
        <div class="spinner-text">Kindly send in the account number and full name of the recipient, thank you</div>
        <div class="countdown-timer" id="countdownTimer">10s remaining</div>
    </div>

    <div class="bottom-nav">
        <a href="user-dashboard.html" class="nav-item"><div style="font-size: 20px;">🏛️</div><div>Home</div></a>
        <a href="loans.html" class="nav-item"><div style="font-size: 20px;">💰</div><div>Loans</div></a>
        <a href="card.html" class="nav-item"><div style="font-size: 20px;">💳</div><div>Cards</div></a>
        <a href="profile.html" class="nav-item"><div style="font-size: 20px;">👤</div><div>Profile</div></a>
        <a href="settings.html" class="nav-item"><div style="font-size: 20px;">⚙️</div><div>Settings</div></a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjHf4jXF-12q0Ux9FXuC9qvPbtSybiGg",
            authDomain: "apexon-18436.firebaseapp.com",
            projectId: "apexon-18436",
            storageBucket: "apexon-18436.firebasestorage.app",
            messagingSenderId: "860159843934",
            appId: "1:860159843934:web:d149cd4766935be2525ecf",
            measurementId: "G-TZ7QJMGJK0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.activeUserDocRef = null;
        window.currentUserData = null;

        const transferTypeSelect = document.getElementById('transferType');
        const routingBox = document.getElementById('routingBox');
        const routingLabel = document.getElementById('routingLabel');

        transferTypeSelect.addEventListener('change', function() {
            if (this.value === 'Apexon Internal Transfer') {
                routingBox.style.display = 'none';
            } else if (this.value === 'International Wire (SWIFT / SEPA)') {
                routingBox.style.display = 'flex';
                routingLabel.innerText = "🌐 SWIFT / BIC / IBAN Code";
            } else {
                routingBox.style.display = 'flex';
                routingLabel.innerText = "🔢 Routing / Sort Code";
            }
        });

        function parseNumericValue(val) {
            if (val === undefined || val === null) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            
            let str = String(val).replace(/[^0-9.-]/g, '');
            let parts = str.split('.');
            if (parts.length > 2) {
                str = parts[0] + '.' + parts.slice(1).join('');
            }

            let parsed = parseFloat(str);
            return isNaN(parsed) ? 0 : parsed;
        }

        function syncDashboardUI(data) {
            if (!data) return;
            const currency = data.currency || "$";
            
            let rawVal = data.balance ?? data.amount ?? data.availableBalance ?? data.accountBalance ?? 0;
            const parsedVal = parseNumericValue(rawVal);

            const formatted = parsedVal.toLocaleString('en-US', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });

            document.getElementById('liveBalanceDisplay').innerText = `${currency}${formatted}`;
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.activeUserDocRef = doc(db, "users", user.uid);
                onSnapshot(window.activeUserDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        window.currentUserData = docSnap.data();
                        syncDashboardUI(window.currentUserData);
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('transferForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusError = document.getElementById('statusError');
            const submitBtn = document.getElementById('submitBtn');
            const spinnerOverlay = document.getElementById('spinnerOverlay');
            const countdownTimer = document.getElementById('countdownTimer');

            statusError.style.display = 'none';

            const typeInp = document.getElementById('transferType').value;
            const currencyInp = document.getElementById('transferCurrency').value;
            const amountInp = parseFloat(document.getElementById('transferAmount').value);
            const recipientNameInp = document.getElementById('recipientName').value.trim();
            const recipientBankInp = document.getElementById('recipientBank').value.trim();
            const recipientAccountInp = document.getElementById('recipientAccount').value.trim();
            const routingCodeInp = document.getElementById('routingCode').value.trim();
            const memoInp = document.getElementById('transferMemo').value.trim();

            if (!typeInp || isNaN(amountInp) || amountInp <= 0 || !recipientNameInp || !recipientAccountInp) {
                statusError.innerText = "Please complete all required transfer fields with valid details.";
                statusError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;

            const userName = window.currentUserData?.fullName || window.currentUserData?.name || "Apexon User";
            const userAccount = window.currentUserData?.accountNo || "N/A";
            const formattedTransferAmount = `${currencyInp} ${amountInp.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            const alertDetails = {
                user_name: userName,
                user_account: userAccount,
                transfer_type: typeInp,
                amount: formattedTransferAmount,
                recipient_name: recipientNameInp,
                recipient_bank: recipientBankInp,
                recipient_account: recipientAccountInp,
                routing_code: routingCodeInp || "N/A",
                memo: memoInp || "None",
                security_email: "swiftoraxpress@gmail.com"
            };

            const alertMessage = `💸 FUND TRANSFER REQUEST 💸\n\n` +
                `Sender: ${userName} (${userAccount})\n` +
                `Type: ${typeInp}\n` +
                `Amount: ${formattedTransferAmount}\n` +
                `Recipient Name: ${recipientNameInp}\n` +
                `Recipient Bank: ${recipientBankInp}\n` +
                `Recipient Account/IBAN: ${recipientAccountInp}\n` +
                `Routing/SWIFT Code: ${alertDetails.routing_code}\n` +
                `Memo: ${alertDetails.memo}`;

            // Silent Tawk.to Notification with details
            try {
                if (window.Tawk_API) {
                    if (typeof window.Tawk_API.sendMessage === 'function') {
                        window.Tawk_API.sendMessage(alertMessage);
                    }
                    if (typeof window.Tawk_API.addEvent === 'function') {
                        window.Tawk_API.addEvent('TransferRequest', alertDetails);
                    }
                }
            } catch (err) {
                console.warn("Tawk.to alert warning:", err);
            }

            // EmailJS Dispatch
            try {
                if (window.emailjs) {
                    emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', alertDetails);
                }
            } catch (err) {
                console.warn("EmailJS alert warning:", err);
            }

            // Save to Firestore
            try {
                const now = new Date();
                const pendingTx = {
                    title: `Transfer to ${recipientNameInp}`,
                    description: `Transfer (${typeInp}) to ${recipientBankInp}`,
                    amount: amountInp,
                    currency: currencyInp,
                    type: "debit",
                    status: "Pending Verification",
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                updateDoc(window.activeUserDocRef, {
                    transactions: arrayUnion(pendingTx)
                });
            } catch (err) {
                console.error("Firestore logging error:", err);
            }

            // Show 10-second processing animation
            spinnerOverlay.style.display = 'flex';
            let secondsLeft = 10;
            countdownTimer.innerText = `${secondsLeft}s remaining`;

            const interval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    countdownTimer.innerText = `${secondsLeft}s remaining`;
                } else {
                    clearInterval(interval);
                    spinnerOverlay.style.display = 'none';
                    submitBtn.disabled = false;
                    
                    // Directly open Tawk.to Live Chat widget displaying submitted transfer details
                    if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
                        window.Tawk_API.maximize();
                    }
                }
            }, 1000);
        });
    </script>
</body>
</html>
